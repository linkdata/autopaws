# Example for one Linux KVM host and one mirrored/single-display target.
# Devices are selected automatically; override paths or target settings as needed.
# For Windows device selectors and audio, see docs/windows-setup.md.
# Loopback API and web viewer, with relative mouse button reports.
# Both binaries accept this file with -config ./autopaws.yaml.
# To serve only the web viewer, set api: ""; MCP requires an enabled API.
api: 127.0.0.1:9329
web: 127.0.0.1:9330
# Optional shared secret for API, web and MCP, read once by each process.
# Use a secret file to update it separately from this configuration.
token-file: ""
# Or store it inline, e.g. token: "REPLACE_WITH_A_RANDOM_SECRET".
# Leaving both empty disables authentication. Set only one to a nonempty value.
token: ""
# Empty auto-detects one CH340/CH341; several adapters need an explicit path.
serial-device: ""
serial-baud: 9600
screen-width: 1920
screen-height: 1080
target-layout: us104
layouts-dir: ""
mouse-button-mode: relative
mouse-mode: legacy
# Opt in for targets that cache unchanged absolute coordinates.
mouse-absolute-refresh: false
# Empty selects the discovery default; use a stable /dev/v4l/by-id or by-path
# symlink for an explicit card when available. Numeric indexes are unsupported.
capture-device: ""
capture-width: 1920
capture-height: 1080
autocrop: false
web-fps: 20
# Empty selects capture audio on the selected video's complete USB device path.
# Set off to disable it, or use an explicit /dev/snd/pcmC...D...c capture path.
# macOS and Windows require an explicit audio selector, or off.
audio-device: ""
log-level: info
debug-keys: false

# MCP-only settings. Empty capture-log disables screenshot logging.
capture-log: ""
tesseract: ""
# Configure both vision-api and vision-model to enable wait_for.
vision-api: ""
vision-model: ""
vision-token-file: ""
vision-max-width: 960
# Omitted provider options default to disabling reasoning when vision is enabled.
# An explicit object replaces the default; '{}' uses provider defaults.
# Include reasoning_effort:none when adding sampling or output options.
vision-request-json: ""
