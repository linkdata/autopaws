# Example for one Linux KVM host and one mirrored/single-display target.
# On Windows use COMn for serial-device and copy dshow: selectors from
# --list-devices for capture-device and audio-device. See docs/windows-setup.md.
# Replace the serial path and target dimensions with your actual configuration.
# Defaults shown explicitly: loopback API and relative mouse button reports.
# To serve only the web viewer, set api: "".
api: 127.0.0.1:9329
web: 127.0.0.1:9330
# Optional shared secret for both API and web, read once at daemon startup.
# Empty disables authentication; otherwise use a readable nonempty UTF-8 file.
token-file: ""
serial-device: /dev/serial/by-id/REPLACE_WITH_YOUR_CH340_OR_CH341
serial-baud: 9600
screen-width: 1920
screen-height: 1080
target-layout: us104
layouts-dir: ""
mouse-button-mode: relative
# Empty selects the discovery default; use a stable /dev/v4l/by-id or by-path
# symlink for an explicit card when available. Numeric indexes are unsupported.
capture-device: ""
capture-width: 1920
capture-height: 1080
autocrop: true
web-fps: 20
# Empty selects capture audio on the selected video's complete USB device path.
# Set off to disable it, or use an explicit /dev/snd/pcmC...D...c capture path.
# macOS and Windows require an explicit audio selector, or off.
audio-device: ""
log-level: info
debug-keys: false
