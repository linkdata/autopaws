name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Require completed release validation notes
        run: |
          if grep -qF RELEASE_VALIDATION_PENDING docs/release-notes.md; then
            echo "::error::Complete release validation and replace the pending release notes before tagging."
            exit 1
          fi
      - name: Build binaries, ZIP bundles and checksums
        run: bash .github/scripts/build-release.sh "$VERSION"
      - name: Publish private-repository release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$VERSION" dist/* \
            --verify-tag --title "$VERSION" --generate-notes \
            --notes-file docs/release-notes.md
