name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Linux amd64 checks and cross-builds
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26.13.1"
          package-manager-cache: false
      - name: Browser syntax and interaction tests
        run: |
          node --check web/assets/viewer-helpers.mjs
          node --check web/assets/viewer.mjs
          node --check web/assets/mapping.mjs
          node --check web/assets/sw.js
          node --check web/assets/audio-playback.mjs
          node --check web/assets/audio-worklet.mjs
          node --test web/*.test.mjs
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go build -o /dev/null ./cmd/autopaws-kvm
      - name: Install generated media fixture dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Race tests with coverage
        env:
          CGO_ENABLED: "1"
          AUTOPAWS_FFMPEG_TEST: "1"
        run: go test -race -coverprofile=coverage.out ./...
      - name: Calculate code coverage
        id: coverage
        run: |
          go tool cover -func=coverage.out | tee coverage-summary.out
          coverage="$(awk '/^total:/ {print $3}' coverage-summary.out)"
          printf 'coverage=%s\n' "$coverage" >> "$GITHUB_OUTPUT"
          go tool cover -html=coverage.out -o=coveragereport.html.out
      - name: Upload code coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: |
            coverage.out
            coveragereport.html.out
          if-no-files-found: error
          retention-days: 7
      - name: Cross-build Linux arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build ./...
          go build -o /dev/null ./cmd/autopaws-kvm
      - name: Cross-build macOS and Windows
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/autopaws-kvm
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/autopaws-mcp
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/autopaws-kvm
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/autopaws-mcp
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/autopaws-kvm
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/autopaws-mcp
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null ./cmd/autopaws-kvm
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o /dev/null ./cmd/autopaws-mcp
      - name: Build and verify release assets
        run: |
          bash .github/scripts/build-release.sh "ci-${GITHUB_SHA::12}"
          (cd dist && sha256sum --check SHA256SUMS)
          for archive in dist/*.zip; do
            unzip -tq "$archive"
          done
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows native checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ffmpeg
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
        env:
          CGO_ENABLED: "0"
      - name: Build daemon and MCP without cgo
        shell: msys2 {0}
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build ./...
          go build -o "$RUNNER_TEMP/autopaws-kvm.exe" ./cmd/autopaws-kvm
          go build -o "$RUNNER_TEMP/autopaws-mcp.exe" ./cmd/autopaws-mcp
      - name: Race tests and generated media fixtures without hardware
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          AUTOPAWS_FFMPEG_TEST: "1"
        run: go test -race ./...

  macos:
    name: macOS native checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
      - name: Build daemon and MCP without cgo
        env:
          CGO_ENABLED: "0"
        run: |
          go build ./...
          go build -o /dev/null ./cmd/autopaws-kvm
      - name: Install macOS capture dependency
        run: brew install ffmpeg
      - name: Race tests without hardware
        env:
          CGO_ENABLED: "1"
          AUTOPAWS_FFMPEG_TEST: "1"
        run: go test -race ./...

  coverage:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download code coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage
      - name: Publish code coverage badge and report
        uses: linkdata/gitcoverage@03383ad3a6ff45e117a50d29d21c3a95c2d5d12a # v11
        with:
          coverage: ${{ needs.check.outputs.coverage }}
          report: coveragereport.html.out
          token: ${{ github.token }}
